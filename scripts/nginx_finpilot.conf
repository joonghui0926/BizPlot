# /etc/nginx/sites-available/finpilot
# 도메인 확정 후 your-domain.com 교체 후 실행:
#   sudo cp /SSD/guest/chojoonghui/FinPilot/scripts/nginx_finpilot.conf /etc/nginx/sites-available/finpilot
#   sudo ln -s /etc/nginx/sites-available/finpilot /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # Let's Encrypt 인증용 (certbot 사용 시 자동 추가됨)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # HTTPS 리다이렉트
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # SSL (certbot: sudo certbot --nginx -d your-domain.com)
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    # API 요청 → FastAPI :8000
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 파일 다운로드 (PDF 리포트)
    location /uploads/ {
        alias /SSD/guest/chojoonghui/FinPilot/data/uploads/;
        internal;
    }

    # 프론트엔드 → Next.js :3000
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
